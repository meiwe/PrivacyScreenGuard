<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 摄像头隐私屏图标：深蓝圆角底 + 白色盾牌 + 盾内镜头 + 保护斜杠 -->
  <!-- 深蓝圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#1E3A5F"/>
  <!-- 白色盾牌：顶部平直，底部收为圆尖 -->
  <path d="M256 64 L408 120 L408 264 C408 366 340 444 256 478 C172 444 104 366 104 264 L104 120 Z" fill="#FFFFFF"/>
  <!-- 盾内镜头外环（深蓝） -->
  <circle cx="256" cy="252" r="78" fill="#1E3A5F"/>
  <!-- 镜头内芯（浅蓝高光） -->
  <circle cx="256" cy="252" r="36" fill="#64B5F6"/>
  <!-- 红色保护斜杠：表示镜头被守护、旁观被挡住 -->
  <line x1="132" y1="368" x2="380" y2="136" stroke="#E74C3C" stroke-width="30" stroke-linecap="round"/>
</svg>
